name: Fork API image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the reviewed worker identity patch
        required: true
        type: string
      checks_only:
        description: Validate upstream integration without rebuilding the deployment image
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-build:
    if: github.repository == 'S13391355/open-asm'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      NODE_OPTIONS: --max-old-space-size=6144
      NO_COLOR: '1'
    steps:
      - name: Validate immutable source reference
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}
      - name: Install locked workspace dependencies
        run: task console:install
      - name: Prove the worker regression fails against the release
        if: ${{ !inputs.checks_only }}
        shell: bash
        run: |
          git show v0.13.0:core-api/src/modules/workers/workers.service.ts > core-api/src/modules/workers/workers.service.ts
          set +e
          task api:test:one SPEC=src/modules/workers/workers.service.spec.ts > /tmp/regression-red.log 2>&1
          result=$?
          set -e
          cat /tmp/regression-red.log
          git restore core-api/src/modules/workers/workers.service.ts
          test "$result" -ne 0
          grep -F 'retains a workspace identity across timeout sweeps' /tmp/regression-red.log
      - name: Lint the workspace sequentially
        run: task lint
      - name: Run API unit tests
        run: task test
      - name: Check API types
        run: task api:typecheck
      - name: Check no tooling changed tracked files
        run: git diff --exit-code
      - uses: docker/setup-buildx-action@v4
        if: ${{ !inputs.checks_only }}
      - name: Build patched API using the repository Dockerfile
        if: ${{ !inputs.checks_only }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core-api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/oasm-api:v0.13.0-worker-identity-${{ inputs.source_sha }}
          build-args: APP_VERSION=v0.13.0-worker-identity
          labels: |
            org.opencontainers.image.source=https://github.com/S13391355/open-asm
            org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Export image and provenance
        if: ${{ !inputs.checks_only }}
        shell: bash
        run: |
          mkdir artefact
          docker save "local/oasm-api:v0.13.0-worker-identity-$SOURCE_SHA" | gzip -1 > artefact/api.tar.gz
          printf '%s\n' "$SOURCE_SHA" > artefact/source-commit.txt
          docker image inspect "local/oasm-api:v0.13.0-worker-identity-$SOURCE_SHA" --format '{{.Id}}' > artefact/image-id.txt
          cd artefact
          sha256sum api.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.checks_only }}
        with:
          name: oasm-api-${{ inputs.source_sha }}
          path: artefact/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
